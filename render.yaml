services:
  - type: web
    name: shredded
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SHREDDED_DB
        value: /opt/render/project/src/data/shredded.db
    disk:
      name: shredded-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
